<style>
/* System fonts only: nothing is downloaded from font services, so no visitor data goes to third parties */
/* Layout: paper loyalty card on a warm counter; rubber-stamp marks are the only ornament; the business accent colours each stamp */
:root{
  --paper:#f4efe6; --card:#fffdf8; --ink:#1c1a17; --muted:#6e675d; --line:rgba(28,26,23,.12);
  --brand:#d9480f; --ok:#2f7d4f; --warn:#b45309; --bad:#b42318; --accent:var(--brand);
  --display:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.025em;margin:0;text-wrap:balance;line-height:1.04}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:520px}
.mid{max-width:760px}
.eyebrow{font:600 .72rem/1.3 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.88rem} .tiny{font-size:.78rem}
.mono{font-family:var(--mono);letter-spacing:.06em}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20;background:rgba(244,239,230,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font:800 1.3rem/1 var(--display);letter-spacing:-.03em}
.logo svg{width:26px;height:26px}
.toplinks{display:flex;gap:20px;font-size:.92rem;align-items:center}
.toplinks a{text-decoration:none;color:var(--muted)} .toplinks a:hover{color:var(--ink)}
.toplinks a.cta{color:var(--paper);background:var(--ink);padding:8px 14px;border-radius:10px}
@media (max-width:760px){.toplinks a:not(.cta){display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1.5px solid var(--ink);background:transparent;font-weight:600;text-decoration:none;cursor:pointer;transition:transform .15s,background .2s,color .2s;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:rgba(180,35,24,.35);color:var(--bad)}
.btn.big{min-height:64px;font-size:1.15rem;border-radius:18px;width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:600}
.field small{font-weight:400;color:var(--muted)}
.input{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:1rem}
.input:focus{outline:none;border-color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--muted)}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--ink);flex:none}
.form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.msg{min-height:1.3em;font-size:.92rem;font-weight:500}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
.stack{display:grid;gap:18px} .stack>*{min-width:0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.note{padding:14px 16px;border-radius:16px;font-size:.92rem;background:rgba(180,83,9,.1);color:#7a3a06}
.note.bad{background:rgba(180,35,24,.1);color:var(--bad)}
.note.ok{background:rgba(47,125,79,.12);color:#1f5a37}
.note b{color:inherit}
/* stamps */
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stamps.n5,.stamps.n10,.stamps.n15,.stamps.n20,.stamps.n25,.stamps.n30{grid-template-columns:repeat(5,1fr)}
.slot{aspect-ratio:1;width:100%;display:block;color:var(--ink)}
.slot .num{font:600 22px/1 var(--body);fill:var(--muted)}
.slot.new g{animation:thump .55s cubic-bezier(.2,1.6,.4,1) both;transform-origin:50px 50px}
@keyframes thump{0%{transform:scale(1.9);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.slot.new g{animation:none}}
/* loyalty card */
.lcard{position:relative;background:var(--card);border-radius:26px;padding:22px 20px 20px;border:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.04),0 24px 48px -28px rgba(60,40,20,.35);overflow:hidden}
.lcard::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--accent)}
.lcard .biz{font:800 1.6rem/1.05 var(--display);letter-spacing:-.02em;margin-top:6px}
.lcard .rw{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:6px 0 18px}
.lcard .rw b{color:var(--accent-ink,var(--accent))}
.ready{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--accent);color:var(--on-accent,#fff);font-weight:600;display:flex;gap:10px;align-items:center}
.qrbig{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line);display:grid;justify-items:center;gap:10px;text-align:center}
.qr{background:#fff;border-radius:14px;padding:8px;border:1px solid var(--line)}
.qr svg{width:100%;height:100%;display:block}
.qrbig .qr{width:min(220px,70vw);aspect-ratio:1}
.code{font:600 1.15rem/1 var(--mono);letter-spacing:.14em}
/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;max-height:88vh;overflow:auto;padding:22px max(16px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.18);transform:translateY(110%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none;visibility:visible}
.sheet:not(.on){visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}
.sheet .inner{max-width:520px;margin:0 auto;display:grid;gap:14px}
.scrim{position:fixed;inset:0;z-index:39;background:rgba(28,26,23,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
/* cookie notice */
.cbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;max-width:560px;margin:0 auto;background:var(--ink);color:var(--paper);border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;font-size:.86rem;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
body.hasbar{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.cbar a{color:#fff} .cbar .btn{min-height:40px;border-color:var(--paper);color:var(--paper);flex:none}
/* landing */
.hero{padding-block:52px 40px;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(2.6rem,7vw,5.2rem)}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero .lede{font-size:1.15rem;color:var(--muted);max-width:32rem;margin:20px 0 28px}
.phone{justify-self:center;width:min(330px,100%);aspect-ratio:9/18.5;border-radius:44px;background:#1c1a17;padding:12px;box-shadow:0 40px 80px -40px rgba(60,40,20,.6)}
.phone .screen{height:100%;border-radius:34px;background:var(--paper);padding:34px 14px 14px;overflow:hidden;display:flex;flex-direction:column;gap:12px}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding-block:32px 20px}.phone{width:min(300px,86%)}}
.section{padding-block:68px;border-top:1px solid var(--line)}
.section h2{font-size:clamp(2rem,4.6vw,3.3rem);margin-bottom:26px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.step{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
.step .n{font:800 2.6rem/1 var(--display);color:var(--brand)}
.step h3{font-size:1.3rem;margin:12px 0 8px}
.step p{color:var(--muted)}
@media (max-width:860px){.steps{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:10px 16px;border-radius:999px;border:1.5px solid var(--ink);font-weight:600}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:700px){.plans{grid-template-columns:1fr}}
.plan{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:10px;align-content:start}
.plan.hi{border-color:var(--ink)}
.plan .big{font:800 clamp(2.6rem,7vw,3.6rem)/1 var(--display);letter-spacing:-.04em}
.ticks{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.ticks li{display:flex;gap:10px}
.ticks li::before{content:"";width:18px;height:18px;flex:none;margin-top:3px;border-radius:50%;border:2.5px solid var(--brand)}
.rules{background:var(--ink);color:var(--paper);border-radius:22px;padding:22px}
.rules p{color:#cfc8bd}
footer.foot{padding-block:28px;border-top:1px solid var(--line);color:var(--muted);font-size:.86rem;margin-top:40px}
footer.foot .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer.foot a{color:var(--muted)}
/* staff */
.scan{position:relative;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:1;max-height:62vh;width:100%}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan .frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#fff;font-weight:600;font-size:.92rem}
.howscan{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.howscan svg{width:64px;height:64px;color:var(--brand)}
.result{border-radius:22px;padding:20px;background:var(--card);border:2px solid var(--accent)}
.done{display:grid;place-items:center;gap:8px;text-align:center;padding:26px;border-radius:22px;background:var(--ok);color:#fff}
.done svg{width:72px;height:72px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:rgba(28,26,23,.05);border-radius:12px;padding:10px}
.kv b{display:block;font:800 1.5rem/1 var(--display);font-variant-numeric:tabular-nums}
.kv span{font-size:.76rem;color:var(--muted)}
/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.tile b{display:block;font:800 2.2rem/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile span{font-size:.84rem;color:var(--muted)}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chart{width:100%;height:auto;display:block}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.feed li:last-child{border-bottom:0}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;background:rgba(28,26,23,.07);white-space:nowrap}
.pill.stamp{background:rgba(217,72,15,.12);color:var(--brand)}
.pill.redeem,.pill.ok{background:rgba(47,125,79,.14);color:var(--ok)}
.pill.review,.pill.warn{background:rgba(180,83,9,.14);color:var(--warn)}
.pill.bad{background:rgba(180,35,24,.12);color:var(--bad)}
.poster{width:100%;max-width:320px;border-radius:12px;border:1px solid var(--line);display:block}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:14px;background:rgba(28,26,23,.06);max-width:100%;width:fit-content}
.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bigcode{font:600 2rem/1 var(--mono);letter-spacing:.2em;padding:18px;border-radius:16px;background:var(--ink);color:var(--paper);text-align:center}
.clist{list-style:none;margin:0;padding:0}
.clist li{border-bottom:1px solid var(--line)}
.clist li:last-child{border-bottom:0}
.clist button{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;background:none;border:0;padding:12px 4px;cursor:pointer}
.clist .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clist .vs{font:800 1.2rem/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.clist .sub{font-size:.8rem;color:var(--muted);grid-column:1/-1}
.table{width:100%;border-collapse:collapse;font-size:.9rem}
.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.table th{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.scrollx{overflow-x:auto}
.legal h2{font-size:1.4rem;margin:26px 0 8px}
.legal p,.legal li{color:#3a352f;margin-bottom:8px}
.legal ul{padding-left:20px}
</style>
</head>

function viewStaff(){
  const s=sess.get();
  if(!s) return loginView("Obsluha",viewStaff);
  document.title="Obsluha · "+s.name;
  const hasDet=("BarcodeDetector" in window);
  app.innerHTML=`<div class="wrap narrow stack" style="padding-block:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div class="eyebrow">Obsluha${s.role==="owner"?" · majitel":""}</div><h1 style="font-size:1.8rem;margin-top:4px">${esc(s.name)}</h1></div><button class="btn ghost sm" id="out" type="button">Odhlásit</button></div>
    <div id="scanArea"></div>
    <div id="res"></div>
    <div class="panel stack" style="gap:12px">
      <b>Zákazník nemá QR po ruce?</b>
      <form class="form" id="manual" novalidate><div class="two" style="grid-template-columns:1fr auto"><input class="input" id="mCode" type="search" placeholder="Jméno, kód karty nebo e-mail" maxlength="120" autocomplete="off" aria-label="Hledat zákazníka"><button class="btn primary" type="submit">Najít</button></div></form>
      <ul class="clist" id="found"></ul>
      <div class="msg err" id="stOut" role="status"></div>
    </div>
    ${s.role==="owner"?`<a class="btn ghost" href="#/prehled">Přehled podniku</a>`:""}
  </div>`;
  $("#out").addEventListener("click",logout);
  let stream=null, raf=0, busy=false;
  const stop=()=>{ cancelAnimationFrame(raf); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } };
  onLeave(stop);
  const idle=()=>{
    $("#scanArea").innerHTML=`<div class="panel stack" style="gap:14px">
      <div class="howscan"><svg aria-hidden="true"><use href="#cam"/></svg><div><b>Naskenujte QR kód zákazníka fotoaparátem telefonu</b><p class="small muted" style="margin-top:4px">Otevřete obyčejný fotoaparát, namiřte na QR na kartě zákazníka a ťukněte na odkaz, který se objeví. Karta se otevře tady a přidáte razítko.</p></div></div>
      ${hasDet?`<button class="btn primary big" id="camBtn" type="button">Nebo skenovat přímo tady</button>`:""}
      <p class="tiny muted">Tip: přihlaste se v prohlížeči, který fotoaparát otevírá (na iPhonu Safari). Přihlášení vydrží, dokud se neodhlásíte.</p></div>`;
    if(hasDet) $("#camBtn").addEventListener("click",startCam);
  };
  async function startCam(){
    $("#stOut").textContent="";
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}); }
    catch(e){ $("#stOut").textContent="Kamera není dostupná. Použijte fotoaparát telefonu nebo zadejte kód karty."; return; }
    $("#scanArea").innerHTML=`<div class="scan"><video id="vid" playsinline muted></video><div class="frame"></div><div class="hint">Namiřte na QR kód karty</div></div><button class="btn ghost" id="camStop" type="button" style="margin-top:10px;width:100%">Zavřít kameru</button>`;
    $("#camStop").addEventListener("click",()=>{ stop(); idle(); });
    const v=$("#vid"); v.srcObject=stream; await v.play().catch(()=>{});
    const det=new BarcodeDetector({formats:["qr_code"]});
    const loop=async()=>{
      if(!stream) return;
      if(!busy&&v.readyState>=2){
        let txt=null; try{ const r=await det.detect(v); if(r[0]) txt=r[0].rawValue; }catch(e){}
        const m=txt&&String(txt).toLowerCase().match(/[0-9a-f]{32}/);
        if(m){ busy=true; if(navigator.vibrate) navigator.vibrate(40); stop(); await find({p_token:m[0]}); return; }
      }
      raf=requestAnimationFrame(loop);
    };
    loop();
  }
  async function find(args,showRestore){
    $("#stOut").textContent=""; $("#found").innerHTML="";
    try{
      const c=await rpc("lookup_card",{p_slug:s.slug,p_code:s.code,p_token:args.p_token});
      $("#scanArea").innerHTML="";

function billingText(bl){
  if(!bl) return {cls:"",text:""};
  if(bl.comp) return {cls:"ok",text:"Štempl máte zdarma."};
  const st=bl.status;
  if(st==="active"||st==="trialing") return {cls:"ok",text:`Předplatné je aktivní (${bl.plan==="year"?"ročně":"měsíčně"})${bl.paid_until?(bl.cancel_at_period_end?", zrušené – platí do ":", další platba ")+fmtD(bl.paid_until):""}.`};
  if(st==="past_due") return {cls:"bad",text:"Poslední platba se nepovedla. Aktualizujte kartu ve správě předplatného, jinak se razítkování za pár dní zastaví."};
  if(bl.in_trial){ const d=Math.max(0,Math.ceil((new Date(bl.trial_ends_at)-Date.now())/864e5)); return {cls:d<=3?"warn":"",text:`Zkušební verze zdarma do ${fmtD(bl.trial_ends_at)} (${d} ${plural(d,"den","dny","dní")}). Pak ${kc(PRICE.month)} měsíčně.`}; }
  return {cls:"bad",text:"Zkušební doba skončila nebo předplatné vypršelo. Zákazníci teď nemohou sbírat razítka. Aktivujte předplatné."};
}
function payUrl(plan,bl,email){
  const u=new URL(PAY[plan]); u.searchParams.set("client_reference_id",bl.id);
  if(email) u.searchParams.set("prefilled_email",email);
  u.searchParams.set("locale","cs");
  return u.toString();
}

  x.font="800 110px system-ui, Arial";
  const words=b.name.split(" "); let line="", y=300; const lines=[];
  words.forEach(w=>{ const t=line?line+" "+w:w; if(x.measureText(t).width>W-160&&line){ lines.push(line); line=w; } else line=t; }); lines.push(line);
  lines.slice(0,2).forEach((l,i)=>x.fillText(l,W/2,y+i*120));
  y+=(Math.min(lines.length,2)-1)*120+110;
  x.font="400 54px system-ui, Arial"; x.fillStyle="#6e675d";
  x.fillText(`${b.stamps_needed} razítek = ${b.reward_text}`, W/2, y);
  const size=760, qx=(W-size)/2, qy=y+70;
  x.fillStyle="#fff"; x.fillRect(qx-30,qy-30,size+60,size+60);
  if(window.StemplQR){ const q=window.StemplQR(url,"M"); const n=q.n, cs=size/n; x.fillStyle="#111";
    for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.dark(r,k)) x.fillRect(qx+k*cs,qy+r*cs,Math.ceil(cs),Math.ceil(cs)); }
  x.fillStyle="#1c1a17"; x.font="800 70px system-ui, Arial"; x.fillText("Naskenujte fotoaparátem", W/2, qy+size+150);
  x.font="400 46px system-ui, Arial"; x.fillStyle="#6e675d"; x.fillText("Karta je zdarma a nic se nestahuje.", W/2, qy+size+225);
  x.font="600 38px system-ui, Arial"; x.fillStyle=b.accent; x.fillText("Štempl", W/2, H-80);
  try{ $("#dl").href=c.toDataURL("image/png"); }catch(e){}
}

function viewTerms(){
  document.title="Obchodní podmínky · Štempl";
  app.innerHTML=`<div class="wrap mid legal" style="padding-block:32px"><div class="eyebrow">Platné od 27. 10. 2026</div><h1 style="font-size:2.4rem;margin-top:8px">Obchodní podmínky služby Štempl</h1>
  <h2>1. Kdo službu poskytuje</h2><p>Provozovatel: ${providerLine()} (dále „provozovatel“). Zákazníkem je podnikatel, který si službu zaregistruje (dále „podnik“). Služba je určena jen podnikatelům, ne spotřebitelům.</p>
  <h2>2. Co služba umí</h2><p>Štempl je webová aplikace pro digitální věrnostní karty: zákazníci podniku si kartu otevřou v mobilu, obsluha přidává razítka a vydává odměny a podnik vidí přehled zákazníků a statistiky. Aplikace může zákazníky požádat o recenzi na Googlu. Počet zaměstnanců ani zařízení podniku není omezený.</p>
  <h2>3. Registrace a zkušební doba</h2><p>Podnik se registruje online a potvrdí e-mail. Prvních 14 dní je zdarma a bez závazku. Když podnik po zkušební době nezaplatí, nic se neúčtuje, jen se pozastaví přidávání razítek a nových karet. Data zůstávají uložená.</p>
  <h2>4. Cena a platby</h2><p>Cena je ${kc(PRICE.month)} měsíčně, nebo ${kc(PRICE.year)} ročně za jeden podnik. ${esc(PROVIDER.vatNote)} Platí se předem platební kartou přes službu Stripe. Předplatné se automaticky obnovuje vždy na další období. Doklad o platbě (fakturu) zasílá Stripe e-mailem a je k dispozici ve správě předplatného.</p>
  <h2>5. Zrušení</h2><p>Podnik může předplatné kdykoli zrušit ve správě předplatného (Přehled → Předplatné). Služba pak běží do konce zaplaceného období a dál se neúčtuje. Za nevyčerpanou část období se peníze nevracejí. Když platba selže, Stripe ji zkusí opakovat. Pokud se do 7 dnů po konci období nepodaří, služba se pozastaví.</p>
  <h2>6. Povinnosti podniku</h2><p>Podnik nastavuje odměny a plní je svým zákazníkům. Za věrnostní program vůči svým zákazníkům odpovídá podnik. Podnik nesmí razítka podmiňovat napsáním recenze a chrání své přístupové kódy. Kód majitele nesmí předávat zaměstnancům, ti používají kód obsluhy.</p>
  <h2>7. Osobní údaje zákazníků podniku</h2><p>Pro osobní údaje svých zákazníků je správcem podnik, provozovatel je jejich zpracovatelem (čl. 28 GDPR). Provozovatel zpracovává údaje jen k provozu služby, podle pokynů podniku daných nastavením aplikace, zajišťuje jejich zabezpečení a mlčenlivost, využívá jen subdodavatele uvedené v <a href="#/soukromi">zásadách ochrany osobních údajů</a>, pomáhá podniku vyřizovat žádosti zákazníků a po skončení služby údaje na žádost podniku smaže nebo předá. Tento odstavec je smlouvou o zpracování osobních údajů.</p>
  <h2>8. Dostupnost a odpovědnost</h2><p>Provozovatel se snaží o nepřetržitý provoz, ale nezaručuje ho. Odstávky a změny funkcí oznamuje předem, pokud to jde. Odpovědnost provozovatele za škodu je omezena na částku, kterou podnik zaplatil za posledních 12 měsíců. Provozovatel neodpovídá za ušlý zisk ani za obsah recenzí na Googlu.</p>
  <h2>9. Ukončení ze strany provozovatele</h2><p>Provozovatel může službu podniku ukončit, pokud podnik hrubě porušuje tyto podmínky nebo zákon. Při ukončení služby provozovatelem z jiného důvodu vrátí poměrnou část zaplacené ceny.</p>
  <h2>10. Změny podmínek a rozhodné právo</h2><p>Změny podmínek oznámí provozovatel e-mailem nejméně 30 dní předem. Podnik je může odmítnout zrušením předplatného. Vztah se řídí českým právem, zejména občanským zákoníkem. Spory řeší obecné soudy ČR.</p>
  <p class="small muted" style="margin-top:24px"><a href="#/">Zpět na úvod</a></p></div>${foot()}`;
}
function viewPrivacy(){
  document.title="Ochrana osobních údajů · Štempl";
  app.innerHTML=`<div class="wrap mid legal" style="padding-block:32px"><div class="eyebrow">Platné od 27. 10. 2026</div><h1 style="font-size:2.4rem;margin-top:8px">Ochrana osobních údajů</h1>

  <h2>Podniky (zákazníci Štemplu)</h2>

  <p>Písma i knihovny aplikace jsou uložené přímo u nás, takže prohlížeč při běžném použití nekomunikuje s dalšími službami. Výjimkou je odkaz na recenzi na Googlu a platební stránka Stripe, které otevíráte sami.</p>
  <h2>Cookies a úložiště v prohlížeči</h2><p>Nepoužíváme reklamní ani analytické cookies. Ukládáme jen to, bez čeho aplikace nefunguje. Podrobnosti najdete v <a href="cookies.html">zásadách cookies</a>.</p>
  <h2>Vaše práva</h2><p>Máte právo na přístup k údajům, opravu, výmaz, omezení zpracování, přenositelnost a vznést námitku. Napište podniku, nebo nám na <a href="mailto:${esc(PROVIDER.email)}">${esc(PROVIDER.email)}</a>. Můžete také podat stížnost u Úřadu pro ochranu osobních údajů (uoou.gov.cz).</p>

  const paying=biz.filter(b=>["active","trialing","past_due"].includes(b.billing.status)).length;
  app.innerHTML=`<div class="wrap stack" style="padding-block:24px;gap:20px">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap"><div><div class="eyebrow">Správa Štemplu</div><h1 style="font-size:2.4rem;margin-top:6px">Podniky</h1></div>
      <div class="row-btns"><a class="btn primary" href="#/novy">Založit podnik</a><button class="btn ghost" id="akOut" type="button">Odhlásit</button></div></div>
    <div class="tiles"><div class="tile"><b>${biz.length}</b><span>podniků</span></div><div class="tile"><b>${paying}</b><span>platících</span></div><div class="tile"><b>${kc(d.mrr||0)}</b><span>měsíční příjem (MRR)</span></div><div class="tile"><b>${d.pending_registrations||0}</b><span>nepotvrzených registrací</span></div></div>
    ${(d.unmatched||[]).length?`<div class="panel stack" style="gap:10px"><b>Platby bez podniku</b><p class="small muted">Někdo zaplatil přes obecný odkaz. Přiřaďte platbu k podniku.</p>${d.unmatched.map(u=>`<div class="row-btns" style="align-items:center"><span class="small">${fmtDT(u.at)} · ${esc(u.email||"")} ${u.business_name?"· "+esc(u.business_name):""}</span><select class="input" style="max-width:220px" data-link="${esc(u.id)}"><option value="">vyberte podnik…</option>${biz.map(b=>`<option value="${esc(b.slug)}">${esc(b.name)}</option>`).join("")}</select></div>`).join("")}</div>`:""}
    <div class="panel scrollx"><table class="table"><thead><tr><th>Podnik</th><th>Předplatné</th><th>Zákazníci</th><th>Razítka 30 d</th><th>Poslední aktivita</th><th>Akce</th></tr></thead><tbody>
      ${biz.map(b=>{ const idle=!b.last_activity||now-new Date(b.last_activity).getTime()>14*864e5;
        return `<tr><td><b>${esc(b.name)}</b><div class="tiny muted mono">${esc(b.slug)}</div><div class="tiny muted">${esc(b.owner_email||"bez e-mailu")}${b.phone?" · "+esc(b.phone):""}</div>${b.has_review_url?"":'<div><span class="pill warn">chybí odkaz na recenze</span></div>'}</td>
          <td>${status(b.billing)}</td><td>${b.customers}</td><td>${b.stamps_30d}</td>
          <td>${b.last_activity?fmtD(b.last_activity):"–"}${idle?' <span class="pill warn">14+ dní nic</span>':""}</td>
          <td><div class="row-btns"><button class="btn sm ghost" data-a="trial" data-s="${esc(b.slug)}">+14 dní</button><button class="btn sm ghost" data-a="comp" data-s="${esc(b.slug)}" data-v="${b.billing.comp?"0":"1"}">${b.billing.comp?"Zrušit zdarma":"Dát zdarma"}</button><button class="btn sm ghost" data-a="code" data-s="${esc(b.slug)}">Nový kód majitele</button><button class="btn sm danger" data-a="del" data-s="${esc(b.slug)}">Smazat</button></div></td></tr>`; }).join("")||'<tr><td colspan="6" class="muted">Zatím žádné podniky.</td></tr>'}
    </tbody></table><div class="msg" id="adOut" role="status"></div></div>
    <div class="panel"><b>Poptávky z webu</b><ul class="feed" style="margin-top:8px">${(d.leads||[]).map(l=>`<li><span><b>${esc(l.business)}</b> · ${esc(l.name)} · ${esc(l.contact)}${l.message?'<br><span class="small muted">'+esc(l.message)+'</span>':""}</span><span class="muted">${fmtD(l.created_at)}</span></li>`).join("")||'<li class="muted">Zatím žádné.</li>'}</ul></div>
  </div>`;
  $("#akOut").addEventListener("click",()=>{ store.del("ikey"); sessionStorage.removeItem("stempl.ikey"); viewAdmin(); });
  $$("[data-a]").forEach(btn=>btn.addEventListener("click",async()=>{
    const a=btn.dataset.a, slug=btn.dataset.s, out=$("#adOut"); out.className="msg";
    try{
      if(a==="trial") await rpc("admin_set_billing",{p_installer_key:key,p_slug:slug,p_comp:null,p_trial_days:14});
      if(a==="comp") await rpc("admin_set_billing",{p_installer_key:key,p_slug:slug,p_comp:btn.dataset.v==="1",p_trial_days:null});
      if(a==="del"){
        const typed=prompt("Smazat podnik "+slug+" i se všemi kartami zákazníků? Nejde to vrátit.\nPro potvrzení napište adresu podniku:");
        if(typed===null) return;
        const r=await rpc("admin_delete_business",{p_installer_key:key,p_slug:slug,p_confirm:typed});
        await adminDash(key);
        $("#adOut").className="msg ok"; $("#adOut").textContent="Podnik "+r.deleted+" smazán ("+r.cards+" karet)."+(r.subscription_to_cancel?" Pozor: má aktivní předplatné "+r.subscription_to_cancel+", zrušte ho ve Stripe.":"");
        return;
      }
      if(a==="code"){ if(!confirm("Vygenerovat nový kód majitele pro "+slug+"? Starý přestane platit.")) return;
        const r=await rpc("reset_business_code",{p_installer_key:key,p_slug:slug});
        openSheet(`<h2 id="sheetTitle" style="font-size:1.5rem">Nový kód majitele</h2><p class="muted">${esc(r.name)} (${esc(r.slug)})</p><div class="bigcode">${esc(r.code)}</div><button class="btn ghost" id="cx" type="button">Zavřít</button>`); $("#cx").addEventListener("click",()=>{ closeSheet(); }); return; }
      adminDash(key);
    }catch(e){ out.className="msg err"; out.textContent=say(e); }
  }));
  $$("[data-link]").forEach(sel=>sel.addEventListener("change",async()=>{
    if(!sel.value) return;
    try{ await rpc("admin_link_payment",{p_installer_key:key,p_slug:sel.value,p_event_id:sel.dataset.link}); adminDash(key); }
    catch(e){ $("#adOut").className="msg err"; $("#adOut").textContent=say(e); }
  }));
}
function viewNew(){
  document.title="Nový podnik · Štempl";
  app.innerHTML=`<div class="wrap narrow stack" style="padding-block:28px">
    <div><div class="eyebrow">Pro správce Štemplu</div><h1 style="font-size:2.4rem;margin-top:8px">Nový podnik</h1><p class="small muted" style="margin-top:6px"><a href="#/sprava">← Správa</a></p></div>
    <form class="form panel" id="newForm" novalidate>
      <label class="field">Instalační klíč<input class="input mono" id="nKey" type="password" autocomplete="off" value="${esc(store.get("ikey","")||sessionStorage.getItem("stempl.ikey")||"")}" required></label>
      <label class="field">Název podniku<input class="input" id="nName" placeholder="Kavárna U Mostu" maxlength="80" required></label>
      <label class="field">Adresa (v odkazu) <small>malá písmena, čísla a pomlčky</small><input class="input mono" id="nSlug" maxlength="40" autocapitalize="off" required></label>
      <div class="two">
        <label class="field">Typ podniku<select class="input" id="nCat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label>
        <label class="field">Barva razítka<input class="input" id="nAccent" type="color" value="#c2410c" style="padding:4px;height:48px"></label>
      </div>
      <div class="two">
        <label class="field">Odměna<input class="input" id="nReward" value="Káva zdarma" maxlength="80" required></label>
        <label class="field">Razítek na odměnu<input class="input" id="nNeeded" type="number" min="3" max="30" value="10" required></label>
      </div>
      <div class="two">
        <label class="field">E-mail majitele <small>nepovinné</small><input class="input" id="nEmail" type="email"></label>
        <label class="field">Zkušební doba (dní)<input class="input" id="nTrial" type="number" min="0" max="365" value="14"></label>
      </div>
      <label class="field">Odkaz na recenzi na Googlu <small>nepovinné, jde doplnit později</small><input class="input" id="nReview" type="url" placeholder="https://g.page/r/…/review"></label>
      <button class="btn primary big" type="submit">Založit podnik</button>
      <div class="msg err" id="nOut" role="status"></div>
    </form><div id="nRes"></div></div>`;
  let touched=false;
  $("#nSlug").addEventListener("input",()=>touched=true);
  $("#nName").addEventListener("input",()=>{ if(!touched) $("#nSlug").value=slugify($("#nName").value); });
  $("#newForm").addEventListener("submit",async e=>{
    e.preventDefault(); const out=$("#nOut"); out.textContent="";
    const slug=slugify($("#nSlug").value), needed=parseInt($("#nNeeded").value,10), url=$("#nReview").value.trim();
    if(slug.length<3){ out.textContent=ERR.bad_slug; return; }
    if(!(needed>=3&&needed<=30)){ out.textContent=ERR.bad_needed; return; }
    if(url&&!/^https:\/\//.test(url)){ out.textContent="Odkaz na recenzi musí začínat https://"; return; }
    try{
      const r=await rpc("create_business",{p_installer_key:$("#nKey").value.trim(),p_name:$("#nName").value.trim(),p_slug:slug,p_category:$("#nCat").value,p_reward:$("#nReward").value.trim(),p_needed:needed,p_review_url:url||null,p_accent:$("#nAccent").value,p_owner_email:$("#nEmail").value.trim()||null,p_trial_days:parseInt($("#nTrial").value,10)||0});
      $("#newForm").hidden=true;
      $("#nRes").innerHTML=`<div class="panel stack"><b>Podnik ${esc(r.name)} je založený.</b><p class="muted small">Zapište si kódy, znovu se nezobrazí.</p>
        <div><div class="small muted">Kód majitele</div><div class="bigcode">${esc(r.code)}</div></div>
        <div><div class="small muted">Kód obsluhy</div><div class="bigcode">${esc(r.staff_code)}</div></div>
        <p class="small"><b>Karta:</b> <span class="mono">${esc(BASE)}#/k/${esc(r.slug)}</span><br><b>Obsluha:</b> <span class="mono">${esc(BASE)}#/obsluha</span> · adresa <b>${esc(r.slug)}</b></p>
        <div class="row-btns"><button class="btn primary" type="button" id="goOwner">Otevřít přehled a stáhnout QR</button><a class="btn ghost" href="#/sprava">Správa</a></div></div>`;
      $("#goOwner").addEventListener("click",()=>{ sess.set({slug:r.slug,code:r.code,name:r.name,role:"owner"}); location.hash="#/prehled/qr"; });
    }catch(err){ out.textContent=say(err); }
  });
}

let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ hiddenAt=Date.now(); return; }
  if(hiddenAt&&Date.now()-hiddenAt>15000&&/^#\/(r|obsluha)/.test(location.hash)&&!$("#sheet").classList.contains("on")) route();
});
addEventListener("pageshow",e=>{ if(e.persisted) route(); });
if("serviceWorker" in navigator&&location.protocol==="https:") addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
route();
})();
</script>
</body>
</html>
